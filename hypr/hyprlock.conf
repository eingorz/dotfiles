$font = "SF Compact Rounded Bold"

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 12
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.3)

    outer_color = rgba(255, 255, 255, 0.8)
    check_color = rgba(200, 200, 200, 0.8)
    fail_color = rgba(255, 0, 0, 0.8)

    font_color = rgb(220, 220, 220)
    fade_on_empty = true
    rounding = 12

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL

    dots_text_format = *
    dots_size = 0.6
    dots_spacing = 0.3

    position = 0, 80   # moved slightly below center
    halign = center
    valign = center
}

# TIME (now bigger and more centered)
label {
    monitor =
    text = $TIME
    font_size = 130
    font_family = $font
    font_color = rgb(255, 255, 255)

    position = 0, -100  # center-top
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 30
    font_family = $font
    font_color = rgb(200, 200, 200)

    position = 0, 50   # below the clock
    halign = center
    valign = top
}

